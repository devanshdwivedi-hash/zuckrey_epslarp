name: 30-Minute Autonomous Pipeline Cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trigger-pipeline-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Agent Cycle
        run: |
          RAW_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RAW_URL" ]; then
            RAW_URL="${{ secrets.VERCEL_APP_URL }}"
          fi
          if [ -z "$RAW_URL" ]; then
            RAW_URL="${{ secrets.APP_URL }}"
          fi
          if [ -z "$RAW_URL" ]; then
            RAW_URL="zuckrey-agent.onrender.com"
          fi

          CLEAN_URL=$(echo "$RAW_URL" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||')
          ENDPOINT="https://${CLEAN_URL}/api/run-cron"

          echo "Triggering Render Background Agent Cycle: ${ENDPOINT}"

          RESPONSE_CODE=$(curl -sSL -X POST -o response.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET || 'zuckrey-secret-2026' }}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'zuckrey-secret-2026' }}" \
            "${ENDPOINT}")

          echo "HTTP Response Code: $RESPONSE_CODE"
          echo "Response Body:"
          cat response.json
          echo ""

          if [ "$RESPONSE_CODE" -ne 200 ]; then
            echo "Triggering endpoint failed with HTTP $RESPONSE_CODE"
            exit 1
          fi

