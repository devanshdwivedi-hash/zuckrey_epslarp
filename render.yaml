services:
  - type: web
    name: zuckrey-epslarp-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zuckrey-epslarp-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: SCRAPING_INTERVAL_MINUTES
        value: 60

databases:
  - name: zuckrey-epslarp-db
    plan: free
